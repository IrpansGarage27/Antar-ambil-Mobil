<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antar & Ambil Mobil</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#dbeafe;--green:#dcfce7;--input:#fff;--inc:#16a34a;--exp:#dc2626;--amber:#fef3c7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#162033;--text:#e2e8f0;--muted:#94a3b8;--line:#263247;--blue:#1e3a5f;--green:#14532d;--input:#0f172a;--inc:#4ade80;--exp:#f87171;--amber:#422006}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#162033;--text:#e2e8f0;--muted:#94a3b8;--line:#263247;--blue:#1e3a5f;--green:#14532d;--input:#0f172a;--inc:#4ade80;--exp:#f87171;--amber:#422006}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
html,body{background:var(--bg)}
body{color:var(--text);max-width:480px;margin:auto;min-height:100vh}
.header{background:#0f172a;color:#fff;padding:22px 20px;border-radius:0 0 22px 22px}
.header small{color:#94a3b8;font-size:13px}
.header h1{font-size:23px;margin-top:5px}
.content{padding:18px}
.section-title{font-size:17px;font-weight:bold;margin-bottom:12px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.card .icon{font-size:25px;margin-bottom:8px}
.card .label{color:var(--muted);font-size:13px}
.card .number{font-size:25px;font-weight:bold;margin-top:4px}
.income{grid-column:span 2}
.income .number{color:var(--inc);font-size:26px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.action-btn{border:none;border-radius:16px;padding:17px 10px;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}
.action-btn span{display:block;font-size:28px;margin-bottom:7px}
.antar{background:#2563eb}.ambil{background:#16a34a}
.history{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.history-item{padding:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.history-item:last-child{border-bottom:none}
.history-left{display:flex;gap:11px;min-width:0}
.history-icon{width:40px;height:40px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.amber{background:var(--amber)}.blue{background:var(--blue)}.neg .number{color:var(--exp)}.rekap-row .dl{margin-top:8px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:bold;cursor:pointer}.green{background:var(--green)}
.history-info{min-width:0}
.history-info strong{font-size:14px}
.history-info small{display:block;color:var(--muted);margin-top:4px;font-size:12px;overflow-wrap:anywhere}
.price{font-weight:bold;font-size:13px;white-space:nowrap}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.bottom-menu{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu-btn{background:var(--card);color:var(--text);border:none;border-radius:15px;padding:15px;font-weight:bold;box-shadow:0 3px 12px rgba(0,0,0,.05);cursor:pointer;font-size:14px}
.menu-btn span{display:block;font-size:23px;margin-bottom:5px}
.back{background:none;border:none;color:var(--text);font-size:15px;font-weight:bold;cursor:pointer;margin-bottom:14px}
.rekap-row{padding:14px 15px;border-bottom:1px solid var(--line)}
.rekap-row:last-child{border-bottom:none}
.rekap-row .top{display:flex;justify-content:space-between;font-weight:bold;font-size:14px}
.rekap-row .top b{color:var(--inc)}.rekap-row small{display:block;margin-top:3px}
.rekap-row small{color:var(--muted);font-size:12px}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:25px 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal{background:var(--card);color:var(--text);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:14px}
.modal label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
.modal input,.modal textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--input);color:var(--text);font-size:15px}
.modal textarea{height:140px;font-size:12px;font-family:monospace}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:none;border-radius:12px;padding:13px;font-weight:bold;font-size:15px;cursor:pointer;color:#fff;background:#2563eb}
.btn.gray{background:var(--line);color:var(--text)}
.btn.red{background:#dc2626}
.msg{font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="header"><small>Dashboard</small><h1>🚗 Antar & Ambil Mobil</h1></div>
<div class="content" id="app"></div>
<div id="modal"></div>

<script>
var KEY='antarambil:v1', EKEY='antarambil:exp:v1';
var BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var data=[], exp=[], view='home';

function loadKey(k){ try{ var r=localStorage.getItem(k), a=r?JSON.parse(r):[]; return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(data)); localStorage.setItem(EKEY,JSON.stringify(exp)); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function rp(n){ return (n<0?'-':'')+'Rp '+new Intl.NumberFormat('id-ID').format(Math.abs(n||0)); }
function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(s){ var p=s.split('-'); return p[2]+' '+BULAN[+p[1]-1].slice(0,3)+' '+p[0]; }
function monthName(k){ var p=k.split('-'); return BULAN[+p[1]-1]+' '+p[0]; }
function byDate(a,b){ return b.date.localeCompare(a.date)||b.id-a.id; }
function stats(list){ var a=0,b=0,t=0; list.forEach(function(x){ if(x.type==='antar')a++; else b++; t+=+x.price||0; }); return {antar:a,ambil:b,total:t}; }
function sumExp(list){ return list.reduce(function(n,x){ return n+(+x.amount||0); },0); }
function inMonth(list,k){ return list.filter(function(x){ return x.date.slice(0,7)===k; }); }
function allMonths(){ var m={}; data.concat(exp).forEach(function(x){ m[x.date.slice(0,7)]=1; }); return Object.keys(m).sort().reverse(); }

function itemHTML(x){
  var a=x.type==='antar';
  return '<div class="history-item" data-id="'+x.id+'"><div class="history-left"><div class="history-icon '+(a?'blue':'green')+'">'+(a?'🚗':'🔑')+'</div><div class="history-info"><strong>'+(a?'Antar Mobil':'Ambil Mobil')+'</strong><small>'+fmtDate(x.date)+' • '+esc(x.car)+(x.note?' • '+esc(x.note):'')+'</small></div></div><div class="price">'+rp(x.price)+'</div></div>';
}
function expHTML(x){
  return '<div class="history-item" data-eid="'+x.id+'"><div class="history-left"><div class="history-icon amber">🧾</div><div class="history-info"><strong>'+esc(x.desc)+'</strong><small>'+fmtDate(x.date)+'</small></div></div><div class="price" style="color:var(--inc)">'+rp(x.amount)+'</div></div>';
}

function render(){
  var h='', list=data.slice().sort(byDate), elist=exp.slice().sort(byDate), mk=today().slice(0,7);
  var s=stats(inMonth(data,mk)), eo=sumExp(inMonth(exp,mk)), net=s.total+eo;
  if(view==='home'){
    h+='<div class="section-title">Rekap '+monthName(mk)+'</div><div class="summary">'
      +'<div class="card"><div class="icon">🚗</div><div class="label">Total Antar</div><div class="number">'+s.antar+'</div></div>'
      +'<div class="card"><div class="icon">🔑</div><div class="label">Total Ambil</div><div class="number">'+s.ambil+'</div></div>'
      +'<div class="card income"><div class="icon">💰</div><div class="label">Upah Antar/Ambil Bulan Ini</div><div class="number">'+rp(s.total)+'</div></div>'
      +'<div class="card"><div class="icon">🧾</div><div class="label">Uang Operasional</div><div class="number" style="font-size:19px">'+rp(eo)+'</div></div>'
      +'<div class="card"><div class="icon">📈</div><div class="label">Total Diterima</div><div class="number" style="font-size:19px;color:'+(net<0?'var(--exp)':'var(--inc)')+'">'+rp(net)+'</div></div></div>'
      +'<div class="section-title">Catat Pekerjaan</div><div class="actions"><button class="action-btn antar" data-new="antar"><span>🚗</span>Catat Antar</button><button class="action-btn ambil" data-new="ambil"><span>🔑</span>Catat Ambil</button></div>'
      +'<div class="section-title">Pekerjaan Terbaru</div><div class="history">'+(list.length?list.slice(0,5).map(itemHTML).join(''):'<div class="empty">Belum ada pekerjaan. Tekan tombol di atas untuk mencatat.</div>')+'</div>'
      +'<div class="bottom-menu"><button class="menu-btn" data-view="riwayat"><span>📋</span>Riwayat</button><button class="menu-btn" data-view="rekap"><span>📊</span>Rekap Bulanan</button><button class="menu-btn" data-view="operasional"><span>🧾</span>Uang Operasional</button><button class="menu-btn" data-backup="1"><span>💾</span>Cadangkan</button></div>';
  } else if(view==='riwayat'){
    h+='<button class="back" data-view="home">← Kembali</button><div class="section-title">Semua Riwayat</div><div class="history">'+(list.length?list.map(itemHTML).join(''):'<div class="empty">Belum ada riwayat.</div>')+'</div><div class="msg" style="text-align:center">Ketuk item untuk mengubah atau menghapus.</div>';
  } else if(view==='operasional'){
    h+='<button class="back" data-view="home">← Kembali</button><div class="section-title">Uang Operasional</div>'
      +'<div class="card" style="margin-bottom:14px"><div class="label">Total '+monthName(mk)+'</div><div class="number">'+rp(eo)+'</div></div>'
      +'<button class="action-btn antar" style="width:100%;margin-bottom:14px" data-newexp="1">＋ Tambah Pengeluaran</button>'
      +'<div class="history">'+(elist.length?elist.map(expHTML).join(''):'<div class="empty">Belum ada pengeluaran operasional.</div>')+'</div><div class="msg" style="text-align:center">Ketuk item untuk mengubah atau menghapus.</div>';
  } else {
    var keys=allMonths();
    h+='<button class="back" data-view="home">← Kembali</button><div class="section-title">Rekap Bulanan</div><div class="history">'
      +(keys.length?keys.map(function(k){
        var st=stats(inMonth(data,k)), e=sumExp(inMonth(exp,k)), n=st.total+e;
        return '<div class="rekap-row"><div class="top"><span>'+monthName(k)+'</span><b style="color:'+(n<0?'var(--exp)':'var(--inc)')+'">'+rp(n)+'</b></div><small>'+st.antar+' antar • '+st.ambil+' ambil</small><small>Upah '+rp(st.total)+' + Operasional '+rp(e)+'</small><button class="dl" data-dl="'+k+'">⬇ Unduh CSV</button></div>';
      }).join(''):'<div class="empty">Belum ada data.</div>')+'</div>'
      +(keys.length?'<div class="bottom-menu"><button class="menu-btn" data-dl="all" style="grid-column:span 2"><span>⬇</span>Unduh Semua Bulan (CSV)</button></div>':'');
  }
  document.getElementById('app').innerHTML=h+'<div class="footer">Data tersimpan di browser ini</div>';
}

function closeModal(){ document.getElementById('modal').innerHTML=''; }

function openForm(type,id){
  var x=id?data.filter(function(d){ return d.id===id; })[0]:null, t=x?x.type:type;
  document.getElementById('modal').innerHTML='<div class="overlay"><div class="modal"><h2>'+(x?'Ubah':'Catat')+' '+(t==='antar'?'Antar 🚗':'Ambil 🔑')+'</h2>'
    +'<label>Tanggal</label><input type="date" id="f-date" value="'+(x?x.date:today())+'">'
    +'<label>Mobil & plat nomor</label><input type="text" id="f-car" placeholder="Avanza B 1234 XX" value="'+esc(x?x.car:'')+'">'
    +'<label>Upah (Rp)</label><input type="number" id="f-price" inputmode="numeric" min="0" value="'+(x?x.price:50000)+'">'
    +'<label>Catatan (opsional)</label><input type="text" id="f-note" value="'+esc(x?x.note:'')+'">'
    +'<div class="msg" id="f-err" style="color:#dc2626"></div><div class="row">'+(x?'<button class="btn red" id="f-del">Hapus</button>':'')+'<button class="btn gray" id="f-cancel">Batal</button><button class="btn" id="f-save">Simpan</button></div></div></div>';
  document.getElementById('f-cancel').onclick=closeModal;
  if(x)document.getElementById('f-del').onclick=function(){ if(confirm('Hapus catatan ini?')){ data=data.filter(function(d){ return d.id!==id; }); save(); closeModal(); render(); } };
  document.getElementById('f-save').onclick=function(){
    var date=document.getElementById('f-date').value, car=document.getElementById('f-car').value.trim(), pr=parseInt(document.getElementById('f-price').value,10), note=document.getElementById('f-note').value.trim();
    if(!date||!car||isNaN(pr)||pr<0){ document.getElementById('f-err').textContent='Isi tanggal, mobil, dan upah dengan benar.'; return; }
    if(x){ x.date=date; x.car=car; x.price=pr; x.note=note; } else data.push({id:Date.now(),type:t,date:date,car:car,price:pr,note:note});
    save(); closeModal(); render();
  };
}

function openExpForm(id){
  var x=id?exp.filter(function(d){ return d.id===id; })[0]:null;
  document.getElementById('modal').innerHTML='<div class="overlay"><div class="modal"><h2>'+(x?'Ubah':'Tambah')+' Uang Operasional 🧾</h2>'
    +'<label>Tanggal</label><input type="date" id="e-date" value="'+(x?x.date:today())+'">'
    +'<label>Keterangan</label><input type="text" id="e-desc" placeholder="Bensin, tol, parkir, ongkos pulang..." value="'+esc(x?x.desc:'')+'">'
    +'<label>Nominal (Rp)</label><input type="number" id="e-amt" inputmode="numeric" min="0" value="'+(x?x.amount:'')+'">'
    +'<div class="msg" id="e-err" style="color:#dc2626"></div><div class="row">'+(x?'<button class="btn red" id="e-del">Hapus</button>':'')+'<button class="btn gray" id="e-cancel">Batal</button><button class="btn" id="e-save">Simpan</button></div></div></div>';
  document.getElementById('e-cancel').onclick=closeModal;
  if(x)document.getElementById('e-del').onclick=function(){ if(confirm('Hapus pengeluaran ini?')){ exp=exp.filter(function(d){ return d.id!==id; }); save(); closeModal(); render(); } };
  document.getElementById('e-save').onclick=function(){
    var date=document.getElementById('e-date').value, desc=document.getElementById('e-desc').value.trim(), amt=parseInt(document.getElementById('e-amt').value,10);
    if(!date||!desc||isNaN(amt)||amt<0){ document.getElementById('e-err').textContent='Isi tanggal, keterangan, dan nominal dengan benar.'; return; }
    if(x){ x.date=date; x.desc=desc; x.amount=amt; } else exp.push({id:Date.now(),date:date,desc:desc,amount:amt});
    save(); closeModal(); render();
  };
}

function openBackup(){
  document.getElementById('modal').innerHTML='<div class="overlay"><div class="modal"><h2>💾 Cadangkan / Pulihkan</h2>'
    +'<div class="msg">Salin teks di bawah dan simpan di tempat aman. Untuk memulihkan, tempel teks cadangan lalu tekan Pulihkan.</div>'
    +'<label>Data</label><textarea id="b-text">'+esc(JSON.stringify({jobs:data,exp:exp}))+'</textarea><div class="msg" id="b-msg"></div>'
    +'<div class="row"><button class="btn gray" id="b-close">Tutup</button><button class="btn gray" id="b-copy">Salin</button><button class="btn" id="b-restore">Pulihkan</button></div></div></div>';
  var ta=document.getElementById('b-text'), msg=document.getElementById('b-msg');
  document.getElementById('b-close').onclick=closeModal;
  document.getElementById('b-copy').onclick=function(){
    ta.select();
    try{ navigator.clipboard.writeText(ta.value).then(function(){ msg.textContent='Tersalin.'; },function(){ msg.textContent='Teks sudah dipilih, salin manual.'; }); }catch(e){ msg.textContent='Teks sudah dipilih, salin manual.'; }
  };
  document.getElementById('b-restore').onclick=function(){
    try{
      var o=JSON.parse(ta.value), jobs=Array.isArray(o)?o:o.jobs, ex=Array.isArray(o)?null:(o.exp||[]);
      if(!Array.isArray(jobs)||!jobs.every(function(r){ return r&&r.date&&r.car&&(r.type==='antar'||r.type==='ambil'); })) throw 0;
      if(ex&&!(Array.isArray(ex)&&ex.every(function(r){ return r&&r.date&&r.desc; }))) throw 0;
      if(!confirm('Ganti semua data saat ini dengan cadangan ini?')) return;
      data=jobs.map(function(r,i){ return {id:r.id||Date.now()+i,type:r.type,date:String(r.date),car:String(r.car),price:+r.price||0,note:r.note?String(r.note):''}; });
      if(ex) exp=ex.map(function(r,i){ return {id:r.id||Date.now()+1000+i,date:String(r.date),desc:String(r.desc),amount:+r.amount||0}; });
      save(); closeModal(); render();
    }catch(e){ msg.textContent='Format data tidak valid.'; }
  };
}

function q(v){ if(typeof v==='string'){ if(/^[=+\-@\t\r]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"'; } return v==null?'':String(v); }
function line(a){ return a.map(q).join(','); }
function buildCsv(keys){
  var out=[];
  keys.forEach(function(k){
    var jobs=inMonth(data,k).sort(function(a,b){ return a.date.localeCompare(b.date); }), ex=inMonth(exp,k).sort(function(a,b){ return a.date.localeCompare(b.date); });
    var s=stats(jobs), e=sumExp(ex);
    out.push(line(['Laporan',monthName(k)]),line(['Total Antar',s.antar]),line(['Total Ambil',s.ambil]),line(['Upah Antar/Ambil',s.total]),line(['Uang Operasional',e]),line(['Total Diterima (Upah + Operasional)',s.total+e]),'',
      line(['Tanggal','Jenis','Mobil','Upah','Catatan']));
    jobs.forEach(function(x){ out.push(line([x.date,x.type==='antar'?'Antar':'Ambil',x.car,x.price,x.note])); });
    out.push('',line(['Tanggal','Keterangan Operasional','Nominal']));
    ex.forEach(function(x){ out.push(line([x.date,x.desc,x.amount])); });
    out.push('','');
  });
  return out.join('\r\n');
}
async function download(k){
  var keys=k==='all'?allMonths().reverse():[k], name=k==='all'?'rekap-semua-bulan.csv':'rekap-'+k+'.csv';
  try{
    var csv='\uFEFF'+buildCsv(keys), d=window.claude?await window.claude.use('downloads'):null;
    if(d){ await d.save({filename:name,data:csv}); return; }
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download=name; document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ if(!e||e.code!=='declined') alert('Gagal mengunduh file.'); }
}

document.addEventListener('click',function(e){
  if(e.target.closest('#modal')) return;
  var el=e.target.closest('[data-new],[data-view],[data-id],[data-backup],[data-eid],[data-newexp],[data-dl]');
  if(!el) return;
  if(el.dataset.dl) download(el.dataset.dl);
  else if(el.dataset.new) openForm(el.dataset.new);
  else if(el.dataset.newexp) openExpForm();
  else if(el.dataset.eid) openExpForm(+el.dataset.eid);
  else if(el.dataset.view){ view=el.dataset.view; render(); window.scrollTo(0,0); }
  else if(el.dataset.id) openForm(null,+el.dataset.id);
  else if(el.dataset.backup) openBackup();
});

data=loadKey(KEY); exp=loadKey(EKEY); render();
</script>
</body>
</html>
